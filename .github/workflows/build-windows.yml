name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: PDF-First-Page-To-Image

jobs:
  build:
    name: Build .exe on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ env.APP_NAME }}"
          --exclude-module numpy --exclude-module PIL --exclude-module matplotlib
          --exclude-module pytest --exclude-module setuptools
          pdf_to_png.py

      - name: Smoke test the built exe
        shell: pwsh
        env:
          # Windows runner 的控制台代码页是 cp1252，这里固定成 UTF-8
          PYTHONIOENCODING: utf-8
        run: |
          # 模拟客户的电子书库结构：每本书一个文件夹，PDF 躺在里面
          $book = "smoke\in\【0001】测试书籍_某作者"
          New-Item -ItemType Directory -Force -Path $book | Out-Null
          @'
          import pymupdf

          doc = pymupdf.open()
          for i in (1, 2):
              page = doc.new_page()
              page.insert_text((72, 100), f"smoke test page {i}", fontsize=28)
          doc.save("smoke/in/【0001】测试书籍_某作者/sample doc.pdf")
          doc.close()
          '@ | Set-Content -Path make_sample.py -Encoding utf8
          python make_sample.py

          # --windowed 打包的 exe 不会阻塞调用方，必须 -Wait
          function Invoke-Exe {
              param([string[]]$ExeArgs)
              $proc = Start-Process -FilePath "dist\${{ env.APP_NAME }}.exe" `
                                    -ArgumentList $ExeArgs -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "exe 退出码 $($proc.ExitCode)：$($ExeArgs -join ' ')" }
          }
          function Assert-File {
              param([string]$Relative)
              $full = Join-Path $PWD $Relative
              if (-not (Test-Path -LiteralPath $full)) {
                  Get-ChildItem -Recurse smoke | Out-String | Write-Host
                  throw "缺少预期文件: $Relative"
              }
              $item = Get-Item -LiteralPath $full
              Write-Host ("OK  {0,-34} {1,7:N1} KB" -f $item.Name, ($item.Length / 1KB))
          }

          # 1) 默认 PNG，封面存回 PDF 所在的文件夹
          Invoke-Exe @('smoke\in', '--dpi', '100')
          Assert-File "$book\sample doc.png"

          # 2) JPG 导出
          Invoke-Exe @('smoke\in', '-f', 'jpg', '--dpi', '100')
          Assert-File "$book\sample doc.jpg"

          # 3) 重复运行不覆盖，而是追加 (1) (2)
          Invoke-Exe @('smoke\in', '-f', 'jpg', '--dpi', '100')
          Invoke-Exe @('smoke\in', '-f', 'jpg', '--dpi', '100')
          Assert-File "$book\sample doc (1).jpg"
          Assert-File "$book\sample doc (2).jpg"

          # 4) 每个 PDF 只取第一页：一共 1 张 png + 3 张 jpg，不多不少
          $images = @(Get-ChildItem -Path smoke -Recurse -Include *.png, *.jpg)
          if ($images.Count -ne 4) {
              Get-ChildItem -Recurse smoke | Out-String | Write-Host
              throw "期望 4 张图片，实际 $($images.Count) 张"
          }

          # 5) 按像素宽度输出：结果必须正好是 640 像素宽，且保持原比例
          Invoke-Exe @('smoke\in', '--width', '640', '-o', 'smoke\w640')
          Assert-File 'smoke\w640\sample doc.png'
          @'
          import struct
          import sys

          data = open(sys.argv[1], "rb").read()
          width, height = struct.unpack(">II", data[16:24])
          want = int(sys.argv[2])
          if width != want:
              sys.exit(f"FAIL: width is {width}, expected {want}")
          # A4 595x842pt -> 640px wide should be ~906px tall
          if not 890 <= height <= 920:
              sys.exit(f"FAIL: height {height} breaks the aspect ratio")
          print(f"OK  PNG is exactly {width}x{height}")
          '@ | Set-Content -Path check_size.py -Encoding utf8
          python check_size.py 'smoke\w640\sample doc.png' 640

          # 6) JPG 必须是 4:4:4 无色度抽样（"尽可能无损"）
          @'
          import sys, struct

          data = open(sys.argv[1], "rb").read()
          i = 2
          while i < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              marker = data[i + 1]
              if marker in (0xC0, 0xC1, 0xC2):
                  n = data[i + 9]
                  factors = [data[i + 11 + c * 3] for c in range(n)]
                  if any(f != 0x11 for f in factors):
                      sys.exit(f"FAIL: JPG uses chroma subsampling {[hex(f) for f in factors]}")
                  print("OK  JPG is 4:4:4 (no chroma subsampling)")
                  sys.exit(0)
              if marker == 0xD8 or marker == 0x01 or 0xD0 <= marker <= 0xD7:
                  i += 2
                  continue
              i += 2 + struct.unpack(">H", data[i + 2:i + 4])[0]
          sys.exit("FAIL: no SOF marker found in JPG")
          '@ | Set-Content -Path check_jpeg.py -Encoding utf8
          python check_jpeg.py "$book\sample doc.jpg"

          $exe = Get-Item "dist\${{ env.APP_NAME }}.exe"
          Write-Host "EXE ->  $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error
          retention-days: 90
